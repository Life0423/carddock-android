# 工程级 Gradle 配置：约束守护进程内存、构建缓存，以及 Kotlin / Android 的编译行为。
# IDE 里改过的 Gradle 设置会覆盖本文件。
# 守护进程内存。编码固定 UTF-8，避免中文资源在非 UTF-8 默认编码的机器上乱码。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 构建缓存：没改过的任务直接复用上次输出。
org.gradle.caching=true
# 配置缓存：AGP 9 推荐的执行方式，配置阶段没变化就跳过。
org.gradle.configuration-cache=true
# 并行只适合模块之间没有耦合的工程。当前只有一个 app 模块，打开没有收益。
# org.gradle.parallel=true
# 使用 AndroidX，而不是已停止维护的 support 库。
android.useAndroidX=true
# 和 IDE 的 Kotlin 官方代码风格保持一致。
kotlin.code.style=official
# 库的 R 类只含它自己声明的资源，不把依赖的资源再导出一遍。
android.nonTransitiveRClass=true
# AGP 9 起默认只给被测 build type 建单测组件，默认工程里就是 debug。
# 开了 Compose 的 variant 仍会注册 Preview runfiles 任务，该任务要求这个 variant 有单测组件。
# 设为 false 后 debug 和 release 都会建单测组件，避免 `./gradlew tasks`
# 在 generateReleaseComposePreviewRunfiles 上报缺组件。这并不等于每次构建都去跑 release 单测。
android.onlyEnableUnitTestForTheTestedBuildType=false
